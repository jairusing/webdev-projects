
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>fifths</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>

  <body>
    <main class="container">
      <section class="py-4 pb-5 border-top">
        <h1 class="circle-title">Circle of Fifths</h1>
        <div id="circle-of-fifths" class="circle-container d-flex justify-content-center align-items-center">
          <p class="loading-text">Loading musical keys...</p>
        </div>
      </section>

      <section class="py-4 pb-5 border-top">
        <div class="section-heading d-flex align-items-center justify-content-between gap-3 mb-4">
          <h2 id="key-title">C Major</h2>
          <span id="key-signature" class="signature-badge">No sharps or flats</span>
        </div>

        <div class="notes-panel p-3 p-md-4 border">
          <div id="scale-notes" class="scale-notes d-flex flex-wrap gap-2"></div>
        </div>

        <div class="pt-4">
          <h3 class="detail-title mb-2">Piano Keyboard</h3>
          <img id="piano-keyboard" class="piano-keyboard d-block mx-auto border" src="imgs/C.png" alt="C major piano keyboard">
        </div>

        <div class="pt-4">
          <h3 class="detail-title mb-2">Diatonic Chords</h3>
          <div id="key-chords" class="row g-2"></div>
        </div>
      </section>
    </main>

  </body>
</html>
